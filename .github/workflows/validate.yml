name: Validate Planar Studio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_MODE: cloud
          VITE_API_URL: https://build-only.example.test
          VITE_SUPABASE_URL: https://build-only.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      - name: Reject loopback production API configuration
        run: |
          if VITE_API_URL=http://127.0.0.1:8000 npm run build; then
            echo 'Production build must reject loopback'
            exit 1
          fi
        env:
          VITE_APP_MODE: cloud
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python -m pytest tests/test_cloud.py -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
